<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Tarefou | Organize suas tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    
    <div class="fundo-decorativo">
        <div class="forma forma-1"></div>
        <div class="forma forma-2"></div>
        <div class="forma forma-3"></div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <h2>Tarefou</h2>

            <nav>
                <a href="#" class="ativo">Início</a>
                <a href="#">Minhas tarefas</a>
                <a href="#">Categorias</a>
                <a href="#">Configurações</a>
            </nav>
        </aside>

        <main class="conteudo">
            <header class="topo">
                <input type="text" placeholder="Buscar tarefa...">
                <button>Nova tarefa</button>
            </header>

            <section class="resumo">

                <div class="boas-vindas">
                    <h1>Olá, boa tarde!</h1>
                    <p>Organize seu dia, uma tarefa de cada vez.</p>
                </div>

                <div class="contadores">

                    <div class="contador">
                        <span>Total</span>
                        <strong>0</strong>
                    </div>

                    <div class="contador">
                        <span>Pendentes</span>
                        <strong>0</strong>
                    </div>

                    <div class="contador">
                        <span>Concluídas</span>
                        <strong>0</strong>
                    </div>

                </div>

            </section>

            <section class="tarefas">

                <div class="titulo-tarefas">
                    <h2>Minhas tarefas</h2>
                    <p>Acompanhe suas atividades por aqui.</p>
                </div>

                <div class="filtros">
                    <button>Todas</button>
                    <button>Pendentes</button>
                    <button>Concluídas</button>
                </div>

                <div class="lista-tarefas">

                </div>

            </section>

        </main>

    </div>
    
</body>
</html>
